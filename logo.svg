<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="watchmeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Badge (Opsional, serasi dengan tema web) -->
  <rect width="400" height="100" rx="16" fill="#111827"/>
  
  <!-- Ikon Logo: Lingkaran Gradasi + Segitiga Play -->
  <g transform="translate(20, 20)">
    <circle cx="30" cy="30" r="28" fill="url(#watchmeGrad)" />
    <polygon points="23,18 45,30 23,42" fill="#111827" />
  </g>

  <!-- Teks Tulisan: WATCHME -->
  <text x="95" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="2">WATCH<tspan fill="#38bdf8">ME</tspan></text>
</svg>
